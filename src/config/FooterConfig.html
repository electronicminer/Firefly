<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定义页脚内容</title>
    <style>
        /* 页脚整体容器 */
        .badge-footer {
            display: flex;
            flex-direction: column;
            padding: 10px 0;
            font-size: 14px;
            color: var(--primary);
        }

        /* 动物图片 水平居中 */
        .animal-img {
            display: flex;
            justify-content: center;
        }

        /* 徽章组：横向同一行展示 */
        .badge-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            align-items: center;
            justify-content: center;
        }

        /* 文字信息行 水平居中 */
        .footer-info {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
            font-size: 13px;
            color: var(--primary);
            line-height: 1.8;
        }

        /* 链接样式 */
        .footer-info a {
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .footer-info a:hover {
            color: #409eff;
        }
    </style>
</head>

<body>
    <div class="badge-footer">
        <!-- 第一行：居中的动物图片 -->
        <div class="animal-img">
            <img alt="animals" src="/assets/images/animals.webp">
        </div>

        <!-- 第二行：所有徽章 -->
        <div class="badge-group">
            <a target="_blank" href="https://astro.build/" title="本站使用 Astro 构建"><img alt="Astro"
                    src="https://img.shields.io/badge/Build-Astro-%23BC52EE?logo=astro&logoColor=%23BC52EE"></a>

            <a target="_blank" href="https://tailwindcss.com/" title="样式基于 Tailwind CSS"><img alt="TailwindCSS"
                    src="https://img.shields.io/badge/Tailwind-CSS-%2306B6D4?logo=tailwindcss&logoColor=%2306B6D4"></a>

            <a target="_blank" href="https://www.typescriptlang.org/" title="构建于 TypeScript"><img alt="TypeScript"
                    src="https://img.shields.io/badge/TypeScript-5.x-%233178C6?logo=typescript&logoColor=%233178C6"></a>

            <a target="_blank" href="https://cn.vitejs.dev/" title="构建工具 Vite"><img alt="Vite"
                    src="https://img.shields.io/badge/Build-Vite-%23646CFF?logo=vite&logoColor=%23646CFF"></a>

            <a target="_blank" href="https://pagefind.app/" title="本站搜索服务 Pagefind"><img alt="Pagefind"
                    src="https://img.shields.io/badge/Search-Pagefind-%23F8A16C?logo=pagefind&logoColor=%23F8A16C"></a>

            <a target="_blank" href="http://creativecommons.org/licenses/by-nc-sa/4.0/"
                title="本站内容采用 CC BY-NC-SA 4.0 许可"><img alt="Copyright"
                    src="https://img.shields.io/badge/Copyright-BY--NC--SA%204.0-d42328?logo=coursera&amp;logoColor=fff"></a>
        </div>

        <!-- 文案 + 版本 -->
        <div class="footer-info">
            <a id="versionText" href="https://github.com/CuteLeaf/Firefly" target="_blank"
                style="display: inline-flex; align-items: center; gap: 4px;">
                <svg width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                    style="vertical-align: middle;">
                    <title>主题</title>
                    <path
                        d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10a2.5 2.5 0 0 0 2.5-2.5c0-.61-.23-1.2-.64-1.67a.528.528 0 0 1-.13-.33c0-.28.22-.5.5-.5H16c3.31 0 6-2.69 6-6c0-4.96-4.49-9-10-9zm5.5 11c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5s1.5.67 1.5 1.5s-.67 1.5-1.5 1.5zm-3-4c-.83 0-1.5-.67-1.5-1.5S13.67 6 14.5 6s1.5.67 1.5 1.5S15.33 9 14.5 9zM5 11.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5S7.33 13 6.5 13S5 12.33 5 11.5zm6-4c0 .83-.67 1.5-1.5 1.5S8 8.33 8 7.5S8.67 6 9.5 6s1.5.67 1.5 1.5z"
                        fill="currentColor"></path>
                </svg>
            </a>
            <span>用 ❤ 与 🚀 构建</span>
        </div>

        <!-- 运行时间 -->
        <div class="footer-info">
            <span id="runtime"></span>
        </div>

    </div>

    <!-- 版本号自动获取 -->
    <script is:inline>
        if (typeof window.__footerVersion === 'undefined') {
            window.__footerVersion = "__THEME_VERSION__";
            window.__footerSvgIcon = `<svg width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="vertical-align: middle;"><title>主题</title><path d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10a2.5 2.5 0 0 0 2.5-2.5c0-.61-.23-1.2-.64-1.67a.528.528 0 0 1-.13-.33c0-.28.22-.5.5-.5H16c3.31 0 6-2.69 6-6c0-4.96-4.49-9-10-9zm5.5 11c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5s1.5.67 1.5 1.5s-.67 1.5-1.5 1.5zm-3-4c-.83 0-1.5-.67-1.5-1.5S13.67 6 14.5 6s1.5.67 1.5 1.5S15.33 9 14.5 9zM5 11.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5S7.33 13 6.5 13S5 12.33 5 11.5zm6-4c0 .83-.67 1.5-1.5 1.5S8 8.33 8 7.5S8.67 6 9.5 6s1.5.67 1.5 1.5z" fill="currentColor"></path></svg>`;
            var versionEl = document.getElementById('versionText');
            if (versionEl) versionEl.innerHTML = window.__footerSvgIcon + ' Astro Firefly Theme @ ' + window.__footerVersion;
        }
    </script>

    <!-- 运行时间核心代码 -->
    <script is:inline>
        if (typeof window.__siteStartTime === 'undefined') {
            // 网站开始运行时间（你的建站日期）
            window.__siteStartTime = "2026-08-14 00:00:00";

            function startRuntime() {
                const runtimeEl = document.getElementById('runtime');
                if (!runtimeEl) return;

                function update() {
                    const start = new Date(window.__siteStartTime).getTime();
                    const now = Date.now();
                    const diff = now - start;

                    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                    runtimeEl.innerHTML = `
                        本站已运行
                        <span style="color:#FFA500">${days}</span>天
                        <span style="color:#1DBF97">${hours}</span>时
                        <span style="color:#8A2BE2">${minutes}</span>分
                        <span style="color:#007EC6">${seconds}</span>秒
                    `;
                }

                update();
                setInterval(update, 1000);
            }

            startRuntime();
        }
    </script>
</body>

</html>
